{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header {% if report_type == 'Lost' %}bg-danger{% else %}bg-success{% endif %} text-white">
                    <h4 class="mb-0">
                        {% if edit_mode %}
                            <i class="bi bi-pencil-square me-2"></i>Edit {{ report_type }} Report
                        {% else %}
                            <i class="bi bi-plus-circle me-2"></i>Report a {{ report_type }} Item
                        {% endif %}
                    </h4>
                </div>                
                <div class="card-body p-4">
                    <form action="{% if edit_mode and item %}{{ url_for('edit_item', item_id=item.id) }}{% else %}{{ url_for('submit_report') }}{% endif %}" method="POST" enctype="multipart/form-data">
                        
                        <input type="hidden" name="type" value="{{ report_type }}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Item Name</label>
                                <input type="text" name="item_name" class="form-control" value="{{ item.item_name if edit_mode and item else '' }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Location</label>
                                <select name="location" id="locationSelect" class="form-select" onchange="checkOther(this)" required>
                                    <option value="" disabled {% if not edit_mode %}selected{% endif %}>Select Location</option>
                                    <option value="Canteen" {% if edit_mode and item and item.location == 'Canteen' %}selected{% endif %}>Canteen</option>
                                    <option value="Library" {% if edit_mode and item and item.location == 'Library' %}selected{% endif %}>Library</option>
                                    <option value="Gym" {% if edit_mode and item and item.location == 'Gym' %}selected{% endif %}>Gym</option>
                                    <option value="Other" {% if edit_mode and item and item.location not in ['Canteen', 'Library', 'Gym'] %}selected{% endif %}>Other (Type below)</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3" id="otherLocationDiv" style="display: none;">
                                <label class="form-label fw-bold">Type Location</label>
                                <input type="text" id="otherLocationInput" name="other_location" class="form-control" 
                                       value="{{ item.location if edit_mode and item and item.location not in ['Canteen', 'Library', 'Gym'] else '' }}" placeholder="Enter specific room or area">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Owner Name (If known)</label>
                                <input type="text" name="owner_name" class="form-control" value="{{ item.owner_name if edit_mode and item else '' }}" placeholder="e.g. Taiyeb Sadat">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Target Student ID</label>
                                <input type="text" name="target_id" class="form-control" value="{{ item.target_id if edit_mode and item else '' }}" placeholder="e.g. 2412517">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Contact Number (Optional)</label>
                                <input type="text" name="contact_no" class="form-control" placeholder="e.g. 01712xxxxxx">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Social/Email (Optional)</label>
                                <input type="text" name="contact_social" class="form-control" placeholder="e.g. FB Link or Email">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description / Current Status</label>
                            <textarea name="description" class="form-control" rows="3" required>{{ item.description if edit_mode and item else '' }}</textarea>
                            <small class="text-muted">Mention where the item is kept now (e.g., 'With the security guard at Gate 1')</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Security Question to Claim</label>
                            <input type="text" name="security_question" class="form-control" value="{{ item.security_question if edit_mode and item else '' }}" placeholder="e.g. What is the color of the phone case?" required>
                        </div>

                        {% if not edit_mode %}
                        <div class="mb-4">
                            <label class="form-label fw-bold">Upload Image</label>
                            <input type="file" name="image" class="form-control">
                        </div>
                        {% endif %}

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn {% if report_type == 'Lost' %}btn-maroon{% else %}btn-iub-blue{% endif %} py-2">
                                {% if edit_mode %}Update Report{% else %}Submit Report{% endif %}
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-light border">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function checkOther(select) {
    const otherDiv = document.getElementById('otherLocationDiv');
    const otherInput = document.getElementById('otherLocationInput');
    if (select.value === 'Other') {
        otherDiv.style.display = 'block';
        otherInput.required = true;
    } else {
        otherDiv.style.display = 'none';
        otherInput.required = false;
        otherInput.value = '';
    }
}

// Ensure the "Other" box shows up correctly on page load if editing
document.addEventListener('DOMContentLoaded', function() {
    const select = document.getElementById('locationSelect');
    checkOther(select);
});
</script>
{% endblock %}
