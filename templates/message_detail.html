{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-iub-blue text-white">
                    <h5 class="mb-0">Message Details</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small">From Student ID: <strong>{{ msg.sender_id }}</strong></p>
                    <div class="p-3 bg-light border rounded mb-3">
                        <h6><strong>Claim Request:</strong></h6>
                        <p>{{ msg.message }}</p>
                    </div>
                    <div class="d-grid gap-2">
                        <a href="{{ url_for('item_detail', item_id=msg.item_id) }}" class="btn btn-primary">Check Item Security Question</a>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
